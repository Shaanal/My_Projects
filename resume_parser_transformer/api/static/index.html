<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Parser</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #2f5bd3; --chip: #eef2fb; --chip-text: #23439c; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1c2028; --text: #e6e8ec; --muted: #98a2b3; --line: #2c323d;
            --accent: #7ea2ff; --chip: #26304a; --chip-text: #c5d4ff; --error: #f97066; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  form { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=file] { flex: 1; min-width: 0; color: var(--muted); }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 18px;
           font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .6; cursor: progress; }
  #status { margin-top: 10px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--error); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .name { font-size: 20px; font-weight: 650; margin: 0; }
  .role { color: var(--muted); margin: 2px 0 10px; }
  .contact { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
  .contact a { color: var(--accent); text-decoration: none; }
  .item + .item { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 14px; }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li { margin: 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--chip); color: var(--chip-text); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .group + .group { margin-top: 10px; }
  .group-label { font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-bottom: 16px; }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
        overflow: auto; font-size: 12.5px; max-height: 480px; }
  footer { color: var(--muted); font-size: 13px; margin-top: 28px; }
  footer a { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Resume Parser</h1>
  <p class="sub">Upload a resume (PDF, DOCX, image or text) to extract structured information.</p>

  <div class="card">
    <form id="form">
      <input id="file" type="file" required
             accept=".pdf,.docx,.txt,.md,.csv,.tsv,.xml,.json,.html,.htm,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp">
      <button id="go" type="submit">Parse</button>
    </form>
    <div id="status"></div>
  </div>

  <section id="result" hidden>
    <div class="actions">
      <button class="ghost" id="toggle" type="button">Show JSON</button>
      <button class="ghost" id="download" type="button">Download JSON</button>
    </div>
    <pre id="json" hidden></pre>
    <div id="cards"></div>
  </section>

  <footer><span id="approach"></span> · <a href="/docs">API docs</a></footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let current = null, filename = "resume";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const chips = (list) => list && list.length
  ? `<div class="chips">${list.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>` : "";
const bullets = (list) => list && list.length ? `<ul>${list.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : "";
const dates = (a, b) => [a, b].filter(Boolean).join(" – ");
const card = (title, body) => body ? `<div class="card"><h2>${title}</h2>${body}</div>` : "";
const link = (url, label) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>` : "";

function render(r) {
  const c = r.candidate, p = r.professional_information, s = r.skills;
  const contact = [c.email && esc(c.email), c.phone_number && esc(c.phone_number), c.location && esc(c.location),
                   link(c.linkedin, "LinkedIn"), link(c.github, "GitHub"), link(c.portfolio, "Portfolio")]
                  .filter(Boolean).map((x) => `<span>${x}</span>`).join("");
  const role = [p.current_or_most_recent_role, p.total_experience && (/experience/i.test(p.total_experience) ? p.total_experience : `${p.total_experience} experience`)]
               .filter(Boolean).map(esc).join(" · ");
  let html = `<div class="card"><p class="name">${esc(c.full_name || "Name not found")}</p>
    ${role ? `<p class="role">${role}</p>` : ""}<div class="contact">${contact}</div></div>`;

  const about = [p.professional_summary, p.career_objective].filter(Boolean);
  html += card("Summary", about.map((t) => `<p style="margin:0 0 8px">${esc(t)}</p>`).join(""));

  const groups = [["Programming languages", s.programming_languages], ["Frameworks", s.frameworks],
                  ["Libraries", s.libraries], ["Databases", s.databases], ["Cloud", s.cloud_technologies],
                  ["DevOps / infrastructure", s.devops_infrastructure], ["Tools", s.tools],
                  ["Other", s.other_relevant_technologies]].filter(([, list]) => list && list.length);
  html += card("Skills", groups.map(([label, list]) =>
    `<div class="group"><div class="group-label">${label}</div>${chips(list)}</div>`).join(""));

  html += card("Experience", r.work_experience.map((e) => `<div class="item">
    <div class="row"><span class="title">${esc([e.designation, e.company].filter(Boolean).join(" · ") || "Role")}</span>
    <span class="meta">${esc(dates(e.start_date, e.end_date))}</span></div>
    ${e.location ? `<div class="meta">${esc(e.location)}</div>` : ""}
    ${bullets(e.responsibilities)}${chips(e.technologies_used)}</div>`).join(""));

  html += card("Projects", r.projects.map((pr) => `<div class="item">
    <div class="title">${esc(pr.name || "Project")}</div>
    ${pr.role ? `<div class="meta">${esc(pr.role)}</div>` : ""}
    ${pr.responsibilities && pr.responsibilities.length ? bullets(pr.responsibilities)
      : pr.summary ? `<p style="margin:6px 0 0">${esc(pr.summary)}</p>` : ""}
    ${chips(pr.technology_stack)}</div>`).join(""));

  html += card("Education", r.education.map((e) => `<div class="item">
    <div class="row"><span class="title">${esc(e.degree || "Education")}</span>
    <span class="meta">${esc(dates(e.start_year, e.end_year))}</span></div>
    <div class="meta">${esc([e.institution, e.grade && `Grade: ${e.grade}`].filter(Boolean).join(" · "))}</div></div>`).join(""));

  const extra = [["Certifications", r.certifications], ["Achievements", r.achievements], ["Volunteering", r.volunteering]]
    .filter(([, list]) => list && list.length);
  html += card("Other", extra.map(([label, list]) =>
    `<div class="group"><div class="group-label">${label}</div>${bullets(list)}</div>`).join(""));

  $("cards").innerHTML = html;
  $("json").textContent = JSON.stringify(r, null, 2);
  $("result").hidden = false;
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const file = $("file").files[0];
  if (!file) return;
  filename = file.name.replace(/\.[^.]+$/, "");
  $("go").disabled = true;
  $("status").className = "";
  $("status").textContent = "Parsing… (scanned files take a little longer)";
  const body = new FormData();
  body.append("file", file);
  try {
    const response = await fetch("/parse-resume", {method: "POST", body});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || response.statusText);
    current = data;
    render(data);
    $("status").textContent = "";
  } catch (error) {
    $("status").className = "error";
    $("status").textContent = `Could not parse this file: ${error.message}`;
  } finally {
    $("go").disabled = false;
  }
});

$("toggle").addEventListener("click", () => {
  $("json").hidden = !$("json").hidden;
  $("toggle").textContent = $("json").hidden ? "Show JSON" : "Hide JSON";
});

$("download").addEventListener("click", () => {
  if (!current) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(current, null, 2)], {type: "application/json"}));
  Object.assign(document.createElement("a"), {href: url, download: `${filename}.json`}).click();
  URL.revokeObjectURL(url);
});

fetch("/health").then((r) => r.json()).then((h) => { $("approach").textContent = `Approach ${h.approach}`; })
  .catch(() => {});
</script>
</body>
</html>
